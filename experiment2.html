<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #f5f1e9;
            font-family: Arial, sans-serif;
            color: #354454;
        }

        /* Header */

        header {
            background-color: #e8e2d7;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            color: #426783;
            font-weight: normal;
            margin: 0;
        }

        nav a {
            text-decoration: none;
            color: #45596a;
            margin-left: 22px;
            font-size: 14px;
        }

        nav a:hover {
            color: #568b91;
        }

        /* Main Container */

        main {
            width: 86%;
            max-width: 1200px;
            margin: auto;
        }

        /* Welcome Section */

        .welcome {
            background-color: #dce8ed;
            padding: 65px 40px;
            margin-top: 30px;
            text-align: center;
            border-radius: 10px;
        }

        .welcome h1 {
            color: #365d78;
            font-size: 34px;
            font-weight: normal;
        }

        .welcome p {
            color: #526777;
            line-height: 1.7;
        }

        button {
            background-color: #527d91;
            color: white;
            border: none;
            padding: 11px 22px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #416879;
        }

        /* Profile and About Section */

        .profile-area {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 25px;
            margin-top: 30px;
        }

        .profile-card {
            background-color: #e9e5dc;
            text-align: center;
            padding: 30px 20px;
            border-radius: 10px;
        }

        .profile-card img {
            width: 145px;
            height: 145px;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile-card h2 {
            color: #426783;
            font-weight: normal;
        }

        .profile-card p {
            font-size: 14px;
            line-height: 1.6;
        }

        .about-card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            line-height: 1.8;
        }

        h2 {
            color: #426783;
            font-weight: normal;
        }

        .details {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        .details td {
            padding: 12px;
            border-bottom: 1px solid #e5e8e7;
        }

        .details td:first-child {
            color: #527d91;
        }

        /* Posts and Sidebar */

        .lower-area {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
            margin-top: 30px;
        }

        .posts-section {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 10px;
        }

        .post-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        article {
            background-color: #f2f4f0;
            padding: 15px;
            border-radius: 8px;
        }

        article img {
            width: 100%;
            height: 145px;
            object-fit: cover;
            border-radius: 5px;
        }

        article h3 {
            color: #426783;
            font-weight: normal;
        }

        article p {
            font-size: 14px;
            line-height: 1.6;
        }

        .sidebar {
            background-color: #dfe9e4;
            padding: 25px;
            border-radius: 10px;
        }

        .sidebar ul {
            padding-left: 20px;
            line-height: 2;
        }

        .sidebar hr {
            border: none;
            border-top: 1px solid #c6d5ce;
            margin: 25px 0;
        }

        /* Contact Section */

        .contact {
            background-color: #e9e5dc;
            padding: 35px;
            margin-top: 30px;
            text-align: center;
            border-radius: 10px;
        }

        .contact input,
        .contact textarea {
            width: 60%;
            padding: 12px;
            margin: 8px;
            border: 1px solid #d1d8d5;
            border-radius: 5px;
            font-family: Arial, sans-serif;
        }

        .contact textarea {
            resize: vertical;
        }

        /* Footer */

        footer {
            background-color: #dce8ed;
            text-align: center;
            padding: 25px;
            margin-top: 30px;
            color: #526777;
        }

        footer p {
            font-size: 13px;
        }

        /* Responsive Layout */

        @media (max-width: 750px) {

            header {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 7px;
            }

            .profile-area,
            .lower-area {
                grid-template-columns: 1fr;
            }

            .post-container {
                grid-template-columns: 1fr;
            }

            .contact input,
            .contact textarea {
                width: 90%;
            }

            main {
                width: 92%;
            }
        }

    </style>
</head>

<body>

    <!-- Header -->
    <header>

        <h2>SHREETHA'S Profile</h2>

        <nav>
            <a href="#home">Home</a>
            <a href="#profile">Profile</a>
            <a href="#posts">Posts</a>
            <a href="#contact">Contact</a>
        </nav>

    </header>

   <main>

        <!-- Welcome Section -->
        <section class="welcome" id="home">

            <h1>Welcome to my Profile</h1>

            <p>
                Welcome to my personal space! Explore my profile,
                interests, and creative ideas.
            </p>

            <a href="#profile">
                <button>Explore My Profile</button>
            </a>

        </section>
